[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-volunteer-desk"
version = "0.1.0"
description = "Reference design: an event-volunteer assistant that answers only with citations and hands the rest to humans."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=1"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1"]

[project.scripts]
volunteer-desk = "volunteer_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volunteer_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
